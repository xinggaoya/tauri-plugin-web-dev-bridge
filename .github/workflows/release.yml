name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-crate:
    name: 发布到 crates.io
    runs-on: ubuntu-latest
    steps:
      # 注意：job 级的 `if` 不支持 `secrets` context（可用的是 github/needs/vars/inputs），
      # 因此「是否配置了凭据」只能在 step 里判断。
      - name: 检查发布凭据
        id: check
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "$CARGO_REGISTRY_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::未配置 CARGO_REGISTRY_TOKEN，跳过 crates.io 发布"
          fi

      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        if: steps.check.outputs.configured == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存 cargo 产物
        if: steps.check.outputs.configured == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 发布前校验
        if: steps.check.outputs.configured == 'true'
        working-directory: src-tauri
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: 发布
        if: steps.check.outputs.configured == 'true'
        working-directory: src-tauri
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --token "$CARGO_REGISTRY_TOKEN"

  publish-npm:
    name: 发布到 npm
    runs-on: ubuntu-latest
    steps:
      - name: 检查发布凭据
        id: check
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::未配置 NPM_TOKEN，跳过 npm 发布"
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        if: steps.check.outputs.configured == 'true'
        with:
          version: 10

      - uses: actions/setup-node@v4
        if: steps.check.outputs.configured == 'true'
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: 安装依赖
        if: steps.check.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile

      - name: 构建产物
        if: steps.check.outputs.configured == 'true'
        run: pnpm run build

      - name: 发布
        if: steps.check.outputs.configured == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm publish --access public --no-git-checks
